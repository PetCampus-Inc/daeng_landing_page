<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Knockdog App Download</title>
    <script>
      (function () {
        var userAgent = navigator.userAgent || '';
        var isAndroid = /android/i.test(userAgent);
        var isIPadOS = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
        var isIOS = /iphone|ipad|ipod/i.test(userAgent) || isIPadOS;
        var appStoreUrl =
          'https://apps.apple.com/kr/app/%EB%98%91%EB%8F%85/id6754978978';
        var googlePlayUrl =
          'https://play.google.com/store/apps/details?id=net.knockdog.petcampus.v2&hl=ko';

        if (isAndroid) {
          window.location.replace(googlePlayUrl);
          return;
        }

        if (isIOS) {
          window.location.replace(appStoreUrl);
          return;
        }

        window.location.replace(appStoreUrl);
      })();
    </script>
  </head>
  <body></body>
</html>
